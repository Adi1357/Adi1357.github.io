<!doctype html>
<html lang="en" data-theme="" data-sensor="visible">

<head>
    {% include head.html %}
</head>

<body>
    {% include nav.html %}

    <main id="main" role="main">
        {{ content }}
    </main>

    {% include footer.html %}

    <!-- Sensor mode transition wash -->
    <div class="sensor-wash" id="sensor-wash" aria-hidden="true"></div>

    <!-- Depth-mode diffusion canvas (pointer trail) -->
    <canvas id="thermal-canvas" aria-hidden="true"></canvas>
    <canvas id="visible-camera-canvas" aria-hidden="true"></canvas>

    <!-- Depth Controls Panel -->
    <div id="thermal-controls" class="thermal-controls" style="display: none;" aria-hidden="true">
        <button id="thermal-controls-toggle" class="thermal-controls-toggle" type="button" aria-label="Toggle depth controls">
            <span class="toggle-icon">⚙️</span>
        </button>
        <div id="thermal-controls-content" class="thermal-controls-content collapsed">
            <div class="thermal-controls-header">
                <span>🧊 Depth Controls</span>
            </div>
            <div class="thermal-control">
                <label for="diff-slider">Spread: <span id="diff-value">0.20</span></label>
                <input type="range" id="diff-slider" min="0" max="0.5" step="0.01" value="0.20" />
            </div>
            <div class="thermal-control">
                <label for="decay-slider">Decay: <span id="decay-value">0.997</span></label>
                <input type="range" id="decay-slider" min="0.95" max="0.999" step="0.001" value="0.997" />
            </div>
            <div class="thermal-control">
                <label for="intensity-slider">Intensity: <span id="intensity-value">2.4</span></label>
                <input type="range" id="intensity-slider" min="0.5" max="5.0" step="0.1" value="2.4" />
            </div>
            <div class="thermal-control">
                <label for="radius-slider">Radius: <span id="radius-value">3</span></label>
                <input type="range" id="radius-slider" min="1" max="10" step="1" value="3" />
            </div>
            <div class="thermal-control">
                <label>Colormap:</label>
                <div class="colormap-buttons">
                    <button class="colormap-btn active" data-colormap="viridis" type="button">Viridis</button>
                    <button class="colormap-btn" data-colormap="magma" type="button">Magma</button>
                    <button class="colormap-btn" data-colormap="inferno" type="button">Inferno</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Visible Camera Controls Panel -->
    <div id="visible-camera-controls" class="thermal-controls" style="display: none;" aria-hidden="true">
        <button id="visible-camera-controls-toggle" class="thermal-controls-toggle" type="button" aria-label="Toggle RGB camera controls">
            <span class="toggle-icon">📷</span>
        </button>
        <div id="visible-camera-controls-content" class="thermal-controls-content collapsed">
            <div class="thermal-controls-header">
                <span>📷 RGB Camera Controls</span>
            </div>
            <div class="camera-presets">
                <button id="visible-noisy-preset" class="camera-preset-btn" type="button">Noisy Preset</button>
                <button id="visible-clean-preset" class="camera-preset-btn" type="button">Clean Preset</button>
            </div>
            <div class="thermal-control">
                <label for="exposure-slider">Exposure Time: <span id="exposure-value">28</span> ms</label>
                <input type="range" id="exposure-slider" min="1" max="500" step="1" value="28" />
            </div>
            <div class="thermal-control">
                <label for="gain-slider">Gain / ISO: <span id="gain-value">100</span></label>
                <input type="range" id="gain-slider" min="100" max="6400" step="50" value="100" />
            </div>
            <div class="thermal-control">
                <label for="read-noise-slider">Read Noise: <span id="read-noise-value">1.2</span> e-</label>
                <input type="range" id="read-noise-slider" min="0.5" max="12.0" step="0.1" value="1.2" />
            </div>
            <div class="thermal-control">
                <label for="shot-noise-slider">Shot Noise: <span id="shot-noise-value">0.2</span></label>
                <input type="range" id="shot-noise-slider" min="0.0" max="2.0" step="0.1" value="0.2" />
            </div>
        </div>
    </div>

    <!-- Sensor Toolbar -->
    <div class="sensor-bar" id="sensor-bar" role="toolbar" aria-label="Sensor mode">
        <button class="sensor-btn active" data-sensor-mode="visible" type="button">
            <span class="sensor-icon">👁️</span> RGB
        </button>
        <button class="sensor-btn" data-sensor-mode="thermal" type="button">
            <span class="sensor-icon">🧊</span> Depth
        </button>
    </div>

    <script src="{{ '/assets/js/visible-camera-canvas.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/thermal-canvas.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>

</html>
